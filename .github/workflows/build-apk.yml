name: Build APK Poket Harian

on:
  push:            # build setiap kali ada push, tak kira nama branch
    paths-ignore:
      - '**/keystore/**'
      - '**.md'
  workflow_dispatch: # butang "Run workflow" manual

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # commit keystore (run pertama) + terbitkan Release APK

env:
  KS_ALIAS: poketharian
  # Lebih selamat: simpan kata laluan dalam Settings > Secrets > Actions sebagai KEYSTORE_PASSWORD
  KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'poketharian123' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cari folder projek: root repo ATAU subfolder (contoh poket-harian-android/)
      - name: Cari folder projek
        run: |
          if [ -f capacitor.config.json ]; then
            PROJ="."
          else
            CFG=$(find . -maxdepth 3 -name capacitor.config.json -not -path "*/node_modules/*" | head -1)
            if [ -z "$CFG" ]; then
              echo "::error::capacitor.config.json tidak dijumpai. Upload isi projek poket-harian-android ke repo."
              exit 1
            fi
            PROJ=$(dirname "$CFG")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Folder projek: $PROJ"
          ls -la "$PROJ"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependency
        run: cd "$PROJ" && npm install

      - name: Bina www/ (bundle library CDN untuk offline)
        run: cd "$PROJ" && node scripts/build-www.mjs

      - name: Jana projek Android
        run: |
          cd "$PROJ"
          rm -rf android
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Set nombor versi (ikut nombor run)
        run: |
          cd "$PROJ"
          MOD=app
          GRADLE="android/$MOD/build.gradle"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Keystore (jana sekali sahaja, kemudian commit)
        run: |
          cd "$PROJ"
          KS_FILE=keystore/poket-harian.jks
          if [ ! -f "$KS_FILE" ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore "$KS_FILE" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Poket Harian, O=Poket Harian, C=MY"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KS_FILE"
            git commit -m "Tambah keystore APK [skip ci]"
            git push || echo "::warning::Gagal commit keystore. Semak Settings > Actions > Workflow permissions = Read and write."
          fi

      - name: Build APK release
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Tandatangan APK
        run: |
          cd "$PROJ"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          MOD=app
          "$BT/zipalign" -p -f 4 "android/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk" aligned.apk
          "$BT/apksigner" sign --ks keystore/poket-harian.jks --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out "$GITHUB_WORKSPACE/PoketHarian.apk" aligned.apk
          "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/PoketHarian.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PoketHarian-APK-${{ github.run_number }}
          path: PoketHarian.apk

      # APK terus di halaman Releases (link tetap: /releases/latest)
      - name: Terbit Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Poket Harian v1.0.${{ github.run_number }}
          body: |
            Build automatik daripada commit ${{ github.sha }}.
            Muat turun PoketHarian.apk di bawah dan install atas app sedia ada (data kekal).
          files: PoketHarian.apk
          make_latest: true
